<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lily Bouquet</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="540" height="960"></canvas>
</div>

<script>
// ---- tweakables ------------------------------------------------------------
const DENSITY = 1.0;   // lower = faster, higher = fuller
const SEED = 11;       // change for a different bouquet
// click / Space = replay
// ----------------------------------------------------------------------------

const W = 540, H = 960, SC = W / 3.7, OX = W / 2, OY = H * 0.88, DW = 6;
const ctx = document.getElementById('c').getContext('2d');
const img = ctx.createImageData(W, H);
const buf = new Uint32Array(img.data.buffer);

let _s = (SEED * 2654435761) >>> 0;
function rnd() {
  _s = (_s + 0x6D2B79F5) | 0;
  let t = Math.imul(_s ^ (_s >>> 15), 1 | _s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const uni = (a, b) => a + (b - a) * rnd();
const norm = (sd = 1) => sd * Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(6.283185307 * rnd());
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255);
const D2R = Math.PI / 180;

const PAL = {
  red: ['#e8262b', '#7a0a10'], pink: ['#e65fb0', '#7a1a55'],
  white: ['#f4efe6', '#a89580'], peach: ['#e3a273', '#8a4a28'],
  yellow: ['#f0cf3a', '#a07018'], maroon: ['#a31224', '#3a050c'],
  purple: ['#c0457f', '#5a1a45'], cream: ['#e6d6c4', '#8a7058'],
  tan: ['#c79a78', '#6e4a30']
};
// x, y, size, rotation, tilt, squash, colour   (back -> front)
const FLOWERS = [
  [0.05, 3.80, 0.50, 10, 0, 0.90, 'tan'],
  [-0.72, 3.50, 0.52, 35, 0, 0.85, 'cream'],
  [0.85, 3.50, 0.58, 20, -20, 0.80, 'yellow'],
  [-1.12, 2.45, 0.58, 15, 10, 0.85, 'yellow'],
  [1.12, 2.75, 0.62, 0, 0, 0.80, 'purple'],
  [-0.02, 3.05, 0.98, 22, 0, 0.88, 'red'],
  [-0.66, 2.02, 0.84, 8, 0, 0.88, 'pink'],
  [0.70, 1.85, 0.84, 30, 0, 0.88, 'white'],
  [1.12, 1.20, 0.62, 10, 40, 0.70, 'maroon'],
  [-1.15, 1.18, 0.62, 0, -20, 0.75, 'yellow'],
  [0.02, 1.12, 0.82, 15, 0, 0.88, 'peach']
];
const SPECKLED = ['white', 'pink', 'peach', 'cream'];

// ---- particle store: final, mid(bud), anchor, timings, colour ---------------
const FX = [], FY = [], MX = [], MY = [], AX = [], AY = [];
const TB = [], D1 = [], TO = [], D2 = [], CR = [], CG = [], CB = [];
function add(fx, fy, mx, my, ax, ay, tb, d1, to, d2, r, g, b) {
  FX.push(fx); FY.push(fy); MX.push(mx); MY.push(my); AX.push(ax); AY.push(ay);
  TB.push(tb); D1.push(d1); TO.push(to); D2.push(d2);
  CR.push(clamp(r) * 255); CG.push(clamp(g) * 255); CB.push(clamp(b) * 255);
}
function bez(p0, p1, p2, t) {
  const a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t;
  return [a * p0[0] + b * p1[0] + c * p2[0], a * p0[1] + b * p1[1] + c * p2[1]];
}

// ---- stems -----------------------------------------------------------------
const stems = [];
for (const [fx, fy] of FLOWERS) {
  const p0 = [uni(-0.22, 0.22), 0], p2 = [fx, fy - 0.05];
  const p1 = [(p0[0] + p2[0]) / 2 + norm(0.05), (p0[1] + p2[1]) / 2];
  stems.push([p0, p1, p2]);
  const len = Math.hypot(p2[0] - p0[0], p2[1] - p0[1]);
  for (let k = Math.floor(150 * len * DENSITY) + 20; k--;) {
    const u = rnd(), q = bez(p0, p1, p2, u), g = rnd();
    const x = q[0] + norm(0.004), y = q[1] + norm(0.004);
    add(x, y, x, y, x, y, 0.2 + u * 1.5, 0.12, 0, 0.01, 0.45 + 0.15 * g, 0.82 + 0.15 * g, 0.2 + 0.1 * g);
  }
}

// ---- leaves ----------------------------------------------------------------
function leaf(base, side, theta, L, wmax, t0) {
  const d = [side * Math.sin(theta), Math.cos(theta)], pp = [-d[1], d[0]];
  for (let k = Math.floor(900 * L * (wmax / 0.07) * DENSITY) + 20; k--;) {
    const u = rnd(), v = uni(-1, 1);
    const w = wmax * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.8)), 0.9);
    const x = base[0] + d[0] * u * L + pp[0] * w * v + side * 0.12 * (u * L) ** 2;
    const y = base[1] + d[1] * u * L + pp[1] * w * v - 0.45 * (u * L) ** 2;
    const c = Math.abs(v) < 0.09 ? [0.5, 0.85, 0.35] : [0.07 + 0.12 * u, 0.42 + 0.25 * u, 0.1 + 0.05 * u];
    const m = 0.85 + 0.3 * rnd();
    add(x, y, x, y, base[0], base[1], t0 + u * 0.9, 0.2, 0, 0.01, c[0] * m, c[1] * m, c[2] * m);
  }
}
for (let i = 0; i < 14; i++) {                       // big arching base leaves
  const s = uni(0.02, 0.22), st = stems[i % stems.length];
  leaf(bez(st[0], st[1], st[2], s), i % 2 === 0 ? -1 : 1,
       uni(0.45, 1.1), uni(0.55, 1.2), 0.06, 0.5 + s * 3);
}
for (let i = 0; i < 9; i++) {                        // slim leaves higher up
  const s = uni(0.25, 0.6), st = stems[i % stems.length];
  leaf(bez(st[0], st[1], st[2], s), rnd() < 0.5 ? -1 : 1,
       uni(0.45, 0.9), uni(0.4, 0.7), 0.04, 0.8 + s * 2);
}

// ---- flowers ---------------------------------------------------------------
const perm = FLOWERS.map((_, i) => i);
for (let i = perm.length - 1; i > 0; i--) {
  const j = Math.floor(rnd() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]];
}
FLOWERS.forEach(([fx, fy, L00, rot, tilt, sq, name], idx) => {
  const L0 = L00 * 1.12;
  const light = hex(PAL[name][0]), dark = hex(PAL[name][1]);
  const tipx = fx, tipy = fy - 0.05;
  const tb = 1.5 + 0.10 * perm[idx], to = 2.2 + 0.20 * perm[idx];
  const tl = tilt * D2R, cs = Math.cos(tl), sn = Math.sin(tl);
  const M00 = cs * cs + sn * sn * sq, M01 = cs * sn * (1 - sq), M11 = sn * sn + cs * cs * sq;

  for (let layer = 0; layer < 2; layer++) {          // outer petals, then inner
    for (let j = 0; j < 3; j++) {
      const a = (rot + j * 120 + 60 * layer + norm(3)) * D2R;
      const L = L0 * (layer === 0 ? 1 : 0.92) * uni(0.95, 1.05);
      const wmax = (layer === 0 ? 0.23 : 0.2) * L;
      const d = [Math.cos(a), Math.sin(a)], pp = [-d[1], d[0]];
      let dc = [Math.cos(a) * 0.28, 1]; const dl = Math.hypot(dc[0], dc[1]); dc = [dc[0] / dl, dc[1] / dl];
      const pc = [-dc[1], dc[0]], curl = j % 2 ? 1 : -1;
      for (let k = Math.floor(2300 * L * L * DENSITY) + 30; k--;) {
        const u = Math.pow(rnd(), 0.95), v = uni(-1, 1);
        const w = wmax * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.75)), 0.9);
        const cu = u * u * u * 0.06 * L * curl;
        const ox = u * L * d[0] + w * v * pp[0] + cu * pp[0];
        const oy = u * L * d[1] + w * v * pp[1] + cu * pp[1];
        const x = fx + M00 * ox + M01 * oy, y = fy + M01 * ox + M11 * oy;
        const mx = fx + u * L * 0.5 * dc[0] + w * v * 0.5 * pc[0];
        const my = fy + u * L * 0.5 * dc[1] + w * v * 0.5 * pc[1];
        const m = clamp(0.15 + 0.85 * Math.pow(u, 0.6));
        let c = [0, 1, 2].map(q => dark[q] * (1 - m) + light[q] * m);
        if (u < 0.16) c = [0.55, 0.62, 0.2];
        if (Math.abs(v) < 0.1) c = c.map(z => z * 0.8);
        if (Math.abs(v) > 0.85) c = c.map(z => z * 1.1);
        if (u < 0.5 && SPECKLED.includes(name) && rnd() < 0.07) c = dark.map(z => z * 0.6);
        add(x, y, mx, my, tipx, tipy, tb + 0.05 * j, 0.5, to + 0.06 * j + 0.1 * layer, 1.3,
            c[0] + norm(0.03), c[1] + norm(0.03), c[2] + norm(0.03));
      }
    }
  }
  for (let k = 0; k < 6; k++) {                      // stamens + anthers
    const a = (rot + 30 + k * 60 + norm(8)) * D2R, Ls = 0.55 * L0;
    const dx = Math.cos(a), dy = Math.sin(a);
    for (let i = Math.floor(55 * L0 * DENSITY) + 6; i--;) {
      const u = rnd(), ox = u * Ls * dx, oy = u * Ls * dy;
      add(fx + M00 * ox + M01 * oy, fy + M01 * ox + M11 * oy, fx, fy, tipx, tipy,
          tb + 0.1, 0.5, to + 0.3, 1.0, 0.85, 0.75, 0.45);
    }
    for (let i = 0; i < 8; i++) {
      const ox = Ls * dx, oy = Ls * dy;
      add(fx + M00 * ox + M01 * oy + norm(0.012), fy + M01 * ox + M11 * oy + norm(0.012),
          fx, fy, tipx, tipy, tb + 0.1, 0.5, to + 0.3, 1.0, 0.6, 0.22, 0.06);
    }
  }
});

// ---- pack ------------------------------------------------------------------
const N = FX.length;
const F32 = a => Float32Array.from(a);
const fx_ = F32(FX), fy_ = F32(FY), mx_ = F32(MX), my_ = F32(MY), ax_ = F32(AX), ay_ = F32(AY);
const tb_ = F32(TB), d1_ = F32(D1), to_ = F32(TO), d2_ = F32(D2);
const col = new Uint32Array(N);
for (let i = 0; i < N; i++) col[i] = (255 << 24) | (CB[i] << 16) | (CG[i] << 8) | CR[i]; // ABGR
const SN = 220, stx = [], sty = [], sph = [], ssp = [], st0 = [];
for (let i = 0; i < SN; i++) {
  stx.push(uni(-2.6, 2.6)); sty.push(uni(-0.4, 5.2));
  sph.push(uni(0, 6.28)); ssp.push(uni(1, 3)); st0.push(uni(4, 7.5));
}

// ---- render ----------------------------------------------------------------
function render(t) {
  buf.fill(0xff000000);
  for (let i = 0; i < SN; i++) {
    const on = clamp(t - st0[i]);
    if (on <= 0) continue;
    const tw = (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * ssp[i] + sph[i]))) * on;
    const x = (OX + stx[i] * SC) | 0, y = (OY - sty[i] * SC) | 0;
    if (x < 0 || x >= W || y < 0 || y >= H) continue;
    const v = (tw * 255) | 0;
    buf[y * W + x] = (255 << 24) | (v << 16) | (v << 8) | v;
  }
  for (let i = 0; i < N; i++) {
    const q1 = (t - tb_[i]) / d1_[i];
    if (q1 <= 0) continue;
    const p1 = q1 > 1 ? 1 : q1;
    let p2 = (t - to_[i]) / d2_[i]; p2 = p2 < 0 ? 0 : p2 > 1 ? 1 : p2;
    const e1 = p1 * p1 * (3 - 2 * p1), e2 = p2 * p2 * (3 - 2 * p2);
    const x = (OX + (ax_[i] + (mx_[i] - ax_[i]) * e1 + (fx_[i] - mx_[i]) * e2) * SC) | 0;
    let y = (OY - (ay_[i] + (my_[i] - ay_[i]) * e1 + (fy_[i] - my_[i]) * e2) * SC) | 0;
    y &= ~1;                                          // scan-line rows
    if (y < 0 || y >= H) continue;
    const c = col[i], row = y * W;
    for (let dx = 0; dx < DW; dx++) {
      const xx = x + dx;
      if (xx >= 0 && xx < W) buf[row + xx] = c;
    }
  }
  ctx.putImageData(img, 0, 0);
}

let start = performance.now();
(function loop(now) { render((now - start) / 1000); requestAnimationFrame(loop); })(start);
const replay = () => { start = performance.now(); };
addEventListener('click', replay);
addEventListener('keydown', e => { if (e.code === 'Space') replay(); });
</script>
</body>
</html>
